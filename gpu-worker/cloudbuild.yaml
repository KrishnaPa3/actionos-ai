# =============================================================================
# Cloud Build config for the ActionOS GPU worker.
#
# Builds remotely on Google's machines rather than a laptop: this image
# installs CUDA-enabled torch and bakes several GB of model weights, which is
# an hours-long job on a home connection and minutes here.
#
# The Hugging Face token is read from Secret Manager at build time and passed
# to Docker as a BuildKit secret. BuildKit secrets are mounted only for the
# single RUN step that needs them and are never written into an image layer,
# so the token does not end up in the published image, in docker history, or
# on anyone's disk.
#
# Run with:
#   gcloud builds submit --config cloudbuild.yaml \
#     --substitutions=_IMAGE=<artifact-registry-path> .
# =============================================================================

substitutions:
  # See the note in backend/cloudbuild.api.yaml: a user substitution's
  # default cannot reference ${PROJECT_ID}. (${PROJECT_ID} elsewhere in this
  # file, such as availableSecrets, expands normally.)
  _IMAGE: 'asia-southeast1-docker.pkg.dev/krishna-test-504810/actionos/gpu-worker:latest'

steps:
  - id: build
    name: 'gcr.io/cloud-builders/docker'
    entrypoint: 'bash'
    secretEnv: ['HF_TOKEN']
    args:
      - '-c'
      - |
        set -e
        if [ -z "$$HF_TOKEN" ]; then
          echo "HF_TOKEN is empty. The gated pyannote model cannot be baked." >&2
          exit 1
        fi
        printf '%s' "$$HF_TOKEN" > /workspace/hf_token
        DOCKER_BUILDKIT=1 docker build \
          --secret id=hf_token,src=/workspace/hf_token \
          -t "${_IMAGE}" .
        rm -f /workspace/hf_token

  - id: push
    name: 'gcr.io/cloud-builders/docker'
    args: ['push', '${_IMAGE}']

availableSecrets:
  secretManager:
    - versionName: 'projects/${PROJECT_ID}/secrets/HF_TOKEN/versions/latest'
      env: 'HF_TOKEN'

# A CUDA image with baked weights needs room and time to build.
options:
  machineType: 'E2_HIGHCPU_8'
  diskSizeGb: 200
  logging: CLOUD_LOGGING_ONLY

timeout: '3600s'
images:
  - '${_IMAGE}'
