# =============================================================================
# ActionOS - Docker Compose (Full Stack)
#
# Services:
#   ollama     - Local LLM inference (Qwen3)
#   backend    - FastAPI application (GPU-enabled)
#   frontend   - Vite React app served via nginx
#
# Usage:
#   docker compose up -d
#   docker compose logs -f
#
# For local development with hot-reload:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d
#
# Environment:
#   Docker Compose reads variables from the root .env file for
#   interpolation (${VAR} syntax).  All Docker-specific values
#   (service URLs, CORS, OAuth redirect URIs) are injected here so
#   developers do NOT need to edit backend/.env or frontend/.env.
# =============================================================================

version: "3.9"

x-common-env: &common-env
  # === Supabase (REQUIRED) ===
  SUPABASE_URL: ${SUPABASE_URL:?SUPABASE_URL is required}
  SUPABASE_KEY: ${SUPABASE_KEY:?SUPABASE_KEY is required}
  SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:?SUPABASE_SERVICE_ROLE_KEY is required}
  SUPABASE_JWT_SECRET: ${SUPABASE_JWT_SECRET:-}

  # === AI Provider ===
  AI_PROVIDER: ${AI_PROVIDER:-ollama}
  OLLAMA_BASE_URL: http://ollama:11434/v1
  OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3:8b}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o}
  GEMINI_API_KEY: ${GEMINI_API_KEY:-}
  GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-pro}
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-sonnet-4}

  # === HuggingFace (required for WhisperX diarization) ===
  HF_TOKEN: ${HF_TOKEN:-}

  # === Notion Integration (optional) ===
  NOTION_API_KEY: ${NOTION_API_KEY:-}
  NOTION_DATABASE_ID: ${NOTION_DATABASE_ID:-}
  NOTION_CLIENT_ID: ${NOTION_CLIENT_ID:-}
  NOTION_CLIENT_SECRET: ${NOTION_CLIENT_SECRET:-}
  # Docker-internal backend URL for OAuth callbacks
  NOTION_REDIRECT_URI: ${NOTION_REDIRECT_URI:-http://backend:8000/oauth/notion/callback}

  # === Google Calendar Integration (optional) ===
  GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
  GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
  GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-http://backend:8000/oauth/google/callback}

  # === Slack Integration (optional) ===
  SLACK_CLIENT_ID: ${SLACK_CLIENT_ID:-}
  SLACK_CLIENT_SECRET: ${SLACK_CLIENT_SECRET:-}
  SLACK_REDIRECT_URI: ${SLACK_REDIRECT_URI:-http://backend:8000/oauth/slack/callback}

  # === Frontend / API URLs (Docker-internal) ===
  # These are the URLs used INSIDE the Docker network.
  # For browser-accessible URLs (OAuth redirects to frontend), set
  # FRONTEND_URL to the public-facing URL.
  FRONTEND_URL: ${FRONTEND_URL:-http://frontend:5173}
  BACKEND_URL: ${BACKEND_URL:-http://backend:8000}
  CORS_ORIGINS: ${CORS_ORIGINS:-http://frontend:5173}

  # === Debug ===
  DEBUG_TIMING: ${DEBUG_TIMING:-0}

services:
  # ===========================================================================
  # Ollama - Local LLM inference server
  # ===========================================================================
  ollama:
    image: ollama/ollama:latest
    container_name: actionos-ollama
    restart: unless-stopped
    runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
    volumes:
      - ollama_models:/root/.ollama
    ports:
      - "11434:11434"
    healthcheck:
      test: ["CMD", "ollama", "list"]      
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 5

  # ===========================================================================
  # Backend - ActionOS FastAPI application
  # ===========================================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: actionos-backend
    restart: unless-stopped
    runtime: nvidia
    environment:
      <<: *common-env
    volumes:
      # Model caches (persist between restarts)
      - huggingface_cache:/root/.cache/huggingface
      - whisper_cache:/root/.cache/whisper
      - torch_cache:/root/.cache/torch
      # Uploaded audio files
      - uploads:/app/uploads
    ports:
      - "8000:8000"
    depends_on:
      ollama:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3

  # ===========================================================================
  # Frontend - ActionOS React application (Vite build + nginx serve)
  # ===========================================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL:?VITE_SUPABASE_URL is required}
        VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY:?VITE_SUPABASE_ANON_KEY is required}
        VITE_SITE_URL: ${VITE_SITE_URL:-http://localhost:5173}
    container_name: actionos-frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    depends_on:
      backend:
        condition: service_healthy

# =============================================================================
# Persistent Volumes
# =============================================================================
volumes:
  ollama_models:
    name: actionos_ollama_models
  huggingface_cache:
    name: actionos_huggingface_cache
  whisper_cache:
    name: actionos_whisper_cache
  torch_cache:
    name: actionos_torch_cache
  uploads:
    name: actionos_uploads